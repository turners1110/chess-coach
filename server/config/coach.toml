# Chess Coach configuration — every tunable number lives here (spec v2.1 §30, instruction 3).
# Labels: tunable | hypothesis | fixed | sam (Sam's decision) | phase0 (set after the Phase 0 benchmark).
# Code must read these values; it must never hard-code them.

[player]
chesscom_username = "turners1110"
time_class_weights = { blitz = 0.5, rapid = 0.5 }  # sam (D5, Oct 30): equal long-term focus
timezone = "America/New_York"

[sync]                          # §7.2
poll_minutes = 30               # tunable
backoff_initial_s = 1           # tunable
backoff_max_s = 60              # tunable
backoff_max_tries = 6           # tunable
serial_requests = true          # fixed: never parallel requests to chess.com
user_agent = "ChessCoach/0.1 (personal coach for chess.com user turners1110; contact: turners1110@gmail.com)"

[import]                        # §7.3, §7.4
